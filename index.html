<html>
<head>
    <meta charset="UTF-8">
    <title>Retro Media Space</title>

    <link rel="stylesheet" href="layout.css">

    <!-- Theme stylesheet -->
    <link id="skinStylesheet" rel="stylesheet" href="style-classic.css">
</head>

<body>
    <div id="page-wrapper">

        <header id="profile-header">
            <h1>Retro Media Space</h1>
            <p class="tagline">music • art • tech • nostalgia</p>
        </header>

        <div id="layout">

            <aside id="sidebar">
                <div class="profile-pic"></div>

                <div class="about-box">
                    <h2>About Me</h2>
                    <p>Cloud student • Artist • Tech explorer</p>
                </div>

                <div class="links-box">
                    <h2>Hobbies</h2>
                    <ul>
                        <li>Music</li>
                        <li>Art</li>
                        <li>Tech</li>
                    </ul>
                </div>
            </aside>

            <main id="main-content">

                <section id="skin-switcher">
                    <h2>Choose Your Theme</h2>
                    <button onclick="setSkin('style-classic.css')">Classic</button>
                    <button onclick="setSkin('style-tron.css')">Tron</button>
                    <button onclick="setSkin('style-barbie.css')">Barbie</button>
                </section>

                <section id="media-player">
                    <div class="wmp-frame">

                        <div class="wmp-titlebar">
                            <span class="wmp-icon"></span>
                            <span class="wmp-title">Now Playing</span>
                        </div>

                        <div class="wmp-display">
                            <canvas id="visualizer"></canvas>
                        </div>

                        <div class="visualizer-mode-box">
                            <select id="visualizer-mode"></select>
                        </div>

                        <div class="wmp-controls">
                            <button class="wmp-btn play-btn">▶</button>
                            <button class="wmp-btn pause-btn">⏸</button>
                            <button class="wmp-btn stop-btn">⏹</button>
                            <button class="wmp-btn next-btn">⏭</button>
                        </div>

                        <div class="wmp-volume">
                            <button class="wmp-btn volume-down">🔉</button>
                            <button class="wmp-btn volume-up">🔊</button>
                        </div>

                    </div>
                </section>

            </main>

        </div>

    </div>

    <script src="player.js"></script>
    <script src="script.js"></script>
</body>
</html>
