<html>
<head>
    <meta charset="UTF-8">
    <title>Retro Media Space</title>

    <link rel="stylesheet" href="layout.css">
    <link id="skinStylesheet" rel="stylesheet" href="style-classic.css">
</head>

<body>
    <div id="page-wrapper">

        <header id="profile-header">
            <h1>Retro Media Space</h1>
            <p class="tagline">music • art • tech • nostalgia</p>
        </header>

        <div id="layout">

            <aside id="sidebar">
                <div class="profile-pic"></div>

    <input type="file" id="profilePicInput" accept="image/*">
        
                <div class="about-box">
                    <h2>About Me</h2>
                    <p>Cloud student • Artist • Tech explorer</p>
                </div>

                <div class="links-box">
                    <h2>Hobbies</h2>
                    <ul>
                        <li>Music</li>
                        <li>Art</li>
                        <li>Tech</li>
                    </ul>
                </div>
            </aside>

            <main id="main-content">

                <section id="skin-switcher">
                    <h2>Choose Your Theme</h2>
                    <button onclick="setSkin('style-classic.css')">Classic</button>
                    <button onclick="setSkin('style-tron.css')">Tron</button>
                    <button onclick="setSkin('style-barbie.css')">Barbie</button>
                </section>

                <section id="media-player">
                    <div class="wmp-frame">

                        <div class="wmp-titlebar">
                            <span class="wmp-icon"></span>
                            <span class="wmp-title">Now Playing</span>
                        </div>

                        <div class="wmp-display">
                            <canvas id="visualizer"></canvas>
                        </div>

                        <div class="visualizer-mode-box">
                            <select id="visualizer-mode"></select>
                        </div>

                        <div class="wmp-track-info">
                            <span id="track-title">Track Title</span>
                            <span id="track-artist">Artist</span>
                        </div>

                        <div class="wmp-seek">
                            <input type="range" id="seek-bar" value="0" min="0" max="100">
                            <div class="wmp-status">
                                <span id="current-time">0:00</span>
                                <span id="duration">0:00</span>
                            </div>
                        </div>

                        <div class="wmp-controls">
                            <button id="play-btn" class="wmp-btn">▶</button>
                            <button id="pause-btn" class="wmp-btn">⏸</button>
                            <button id="stop-btn" class="wmp-btn">⏹</button>
                            <button id="next-btn" class="wmp-btn">⏭</button>
                            <button id="prev-btn" class="wmp-btn">⏮</button>
                            <button id="repeat-btn" class="wmp-btn">🔁</button>
                        </div>

                        <div class="wmp-volume">
                            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
                        </div>

                        <audio id="audio-player"></audio>

                    </div>
                </section>

            </main>

        </div>

    </div>

    <script src="player.js"></script>
    <script src="script.js"></script>
</body>
</html>
